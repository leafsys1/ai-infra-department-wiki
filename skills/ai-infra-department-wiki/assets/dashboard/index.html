const DEMO={records:[
{id:'CASE-2026-0001',type:'case',title:'Prefill throughput after batch scheduling',status:'verified',visibility:'internal',owners:['alice'],area:'inference',model_family:'deepseek',accelerator:'910B2C',updated:'2026-09-21',tags:['prefill','throughput','kv-cache'],summary:'A reviewed case showing how batch scheduling changed prefill throughput under KV pressure.',path:'records/cases/inference/CASE-2026-0001.md'},
{id:'EVD-2026-0001',type:'evidence',title:'128K prefill benchmark digest',status:'verified',visibility:'internal',owners:['alice'],area:'inference',model_family:'deepseek',accelerator:'910B2C',updated:'2026-09-21',tags:['benchmark','prefill'],summary:'Reproducible benchmark evidence attached to CASE-2026-0001.',path:'records/evidence/EVD-2026-0001.md'},
{id:'PAT-2026-0001',type:'pattern',title:'Batch scheduling and KV pressure coupling',status:'proposed',visibility:'internal',owners:['bob'],area:'inference',model_family:'',accelerator:'',updated:'2026-09-21',tags:['scheduling','kv-cache'],summary:'A candidate pattern for review before promotion into a reusable Skill.',path:'records/patterns/PAT-2026-0001.md'},
{id:'DEC-2026-0001',type:'decision',title:'Use evidence-backed records for migration handoffs',status:'verified',visibility:'internal',owners:['carol'],area:'migration',model_family:'',accelerator:'',updated:'2026-09-18',tags:['governance','handoff'],summary:'Decision record defining the minimum evidence and review bar.',path:'records/decisions/DEC-2026-0001.md'},

],edges:[{source:'CASE-2026-0001',target:'EVD-2026-0001',relation:'has_evidence'},{source:'PAT-2026-0001',target:'CASE-2026-0001',relation:'derived_from'}]};
let state={data:DEMO,type:'all',status:'all',query:'',sort:'updated'};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=value=>Array.isArray(value)?value:(value===undefined||value===null||value==='')?[]:[value];
function renderMarkdown(source){const lines=String(source||'').split(/\r?\n/),out=[];let paragraph=[];const flush=()=>{if(paragraph.length){out.push(`<p>${paragraph.map(esc).join('<br>')}</p>`);paragraph=[]}};for(const line of lines){const heading=line.match(/^(#{1,4})\s+(.+)$/);if(heading){flush();const level=Math.min(4,heading[1].length+1);out.push(`<h${level}>${esc(heading[2])}</h${level}>`)}else if(!line.trim()){flush()}else{paragraph.push(line)}}flush();return out.join('')}
function normRecord(r){return {id:r.id||r.data?.id||'UNKNOWN',type:r.type||r.data?.type||'case',title:r.title||r.data?.title||r.id||'Untitled',status:r.status||r.data?.status||'observed',visibility:r.visibility||r.data?.visibility||'internal',owners:list(r.owners||r.data?.owners).map(String),area:r.area||r.areas?.[0]||r.data?.area||r.data?.areas?.[0]||'',model_family:r.model_family||r.context?.model_family||r.data?.model_family||'',accelerator:r.accelerator||r.context?.accelerator_model||r.data?.accelerator||'',updated:r.updated||r.data?.updated||'',tags:list(r.tags||r.data?.tags).map(String),evidence:list(r.evidence||r.data?.evidence).map(String),relations:list(r.relations||r.data?.relations),supersedes:list(r.supersedes||r.data?.supersedes).map(String),superseded_by:list(r.superseded_by||r.data?.superseded_by).map(String),summary:r.summary||r.data?.summary||'',content:r.content||r.data?.content||'',sources:list(r.sources||r.data?.sources||r.data?.source_urls||r.data?.source).map(String),path:r.path||''};}
function normalizeEdges(data, records){const edges=[];const add=(from,type,to)=>{if(from&&to)edges.push({source:String(from),target:String(to),relation:String(type||'关联')})};for(const edge of (data.edges||[]))add(edge.source||edge.from,edge.relation||edge.type||edge.relation_type,edge.target||edge.to);for(const r of records){for(const id of (r.evidence||[]))add(r.id,'has_evidence',id);for(const rel of (r.relations||[]))add(r.id,rel.type||rel.relation,rel.target);for(const id of (r.supersedes||[]))add(r.id,'supersedes',id);for(const id of (r.superseded_by||[]))add(id,'supersedes',r.id);}return [...new Map(edges.map(e=>[`${e.source}\0${e.relation}\0${e.target}`,e])).values()];}
function load(data){const records=(data.records||[]).map(normRecord);state.data={records,edges:normalizeEdges(data,records)};render();renderTree();renderGraph();toast(`已加载 ${state.data.records.length} 条记录`)}
function switchView(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===name));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${name}`));}
function renderTree(){const labels={case:'案例',evidence:'证据',decision:'决策',pattern:'实践模式',runbook:'运行手册',environment:'环境基线'};$('knowledgeTree').innerHTML=Object.keys(labels).map(type=>{const items=state.data.records.filter(r=>r.type===type);if(!items.length)return'';return `<h3>${labels[type]} (${items.length})</h3>${items.map(r=>`<button data-read="${esc(r.id)}">${esc(r.title)}</button>`).join('')}`}).join('');document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>readRecord(b.dataset.read));}
function openSource(value){const source=String(value||'');if(/^(https?:\/\/|mailto:)/i.test(source)){window.open(source,'_blank','noopener,noreferrer');return;}toast('本地来源请在知识仓中打开对应记录文件。');}
function readRecord(id){const r=state.data.records.find(x=>x.id===id);if(!r)return;switchView('reader');document.querySelectorAll('[data-read]').forEach(b=>b.classList.toggle('active',b.dataset.read===id));$('readerTitle').textContent=r.title;$('readerMeta').textContent=`${r.id} · ${r.status} · ${(r.owners||[]).join(', ')||'暂无负责人'} · ${r.updated||'暂无日期'}`;const rels=state.data.edges.filter(e=>e.source===id||e.target===id);const sources=r.sources||[];const body=r.content?renderMarkdown(r.content):`<p>${esc(r.summary||'该记录暂未提供正文或摘要。')}</p>`;$('readerBody').innerHTML=`${body}<h2>适用上下文</h2><p>领域：${esc(r.area||'—')}　模型：${esc(r.model_family||'—')}　加速器：${esc(r.accelerator||'—')}</p><h2>标签</h2><p>${esc((r.tags||[]).join(' · ')||'—')}</p><h2>引用关系</h2>${rels.length?rels.map(e=>{const target=e.source===id?e.target:e.source;return `<div class="relation">${esc(e.relation||'关联')} · <a href="#" data-read-link="${esc(target)}">${esc(target)}</a></div>`}).join(''):'<p class="meta">暂无引用关系。</p>'}<h2>来源</h2><div class="source-list">${sources.length?sources.map(s=>`<p><a href="#" data-source="${esc(s)}">${esc(s)}</a></p>`).join(''):`<p>${esc(r.path||'暂无来源路径')}</p>`}</div>`;document.querySelectorAll('[data-source]').forEach(a=>a.onclick=e=>{e.preventDefault();openSource(a.dataset.source)});}
function renderGraph(){const records=state.data.records.slice(0,80),cols=5,rowHeight=110,height=Math.max(620,Math.ceil(records.length/cols)*rowHeight+80),byId=new Map(records.map((r,i)=>[r.id,{r,i,x:90+(i%cols)*150,y:80+Math.floor(i/cols)*rowHeight}]));const edges=state.data.edges.filter(e=>byId.has(e.source)&&byId.has(e.target));$('graphCanvas').innerHTML=`<svg viewBox="0 0 820 ${height}" style="height:${height}px" role="img" aria-label="知识关系图">${edges.map(e=>{const a=byId.get(e.source),b=byId.get(e.target);return `<line class="graph-edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"><title>${esc(e.relation||'关联')}</title></line>`}).join('')}${[...byId.values()].map(({r,x,y})=>`<g class="graph-node" data-graph-id="${esc(r.id)}" transform="translate(${x},${y})"><circle r="22"></circle><text text-anchor="middle" y="38">${esc(r.id)}</text><title>${esc(r.title)}</title></g>`).join('')}</svg>`;document.querySelectorAll('[data-graph-id]').forEach(n=>n.onclick=()=>readRecord(n.dataset.graphId));}
function filtered(){let rs=state.data.records.filter(r=>(state.type==='all'||r.type===state.type)&&(state.status==='all'||r.status===state.status));const q=state.query.trim().toLowerCase();if(q)rs=rs.filter(r=>JSON.stringify(r).toLowerCase().includes(q));return rs.sort((a,b)=>state.sort==='title'?a.title.localeCompare(b.title):state.sort==='type'?a.type.localeCompare(b.type):state.sort==='status'?a.status.localeCompare(b.status):(b.updated||'').localeCompare(a.updated||''));}
function countBy(key,rs=state.data.records){return rs.reduce((m,r)=>(m[r[key]]= (m[r[key]]||0)+1,m),{})}
function render(){const all=state.data.records;const rs=filtered();$('allCount').textContent=all.length;$('totalStat').textContent=all.length;$('verifiedStat').textContent=all.filter(r=>r.status==='verified').length;$('verifiedNote').textContent=`${all.length?Math.round(all.filter(r=>r.status==='verified').length/all.length*100):0}% 的记录`;$('ownerStat').textContent=new Set(all.flatMap(r=>r.owners)).size;$('relationStat').textContent=state.data.edges.length;$('resultCount').textContent=`${rs.length} 条结果`;$('listTitle').textContent=state.type==='all'?'全部知识':({'case':'案例','evidence':'证据','decision':'决策','pattern':'实践模式','runbook':'运行手册','environment':'环境基线'}[state.type]||state.type);
 document.querySelectorAll('[data-count]').forEach(el=>el.textContent=all.filter(r=>r.type===el.dataset.count).length);renderBars(countBy('status'),$('statusBars'));renderBars(countBy('type'),$('typeBars'));renderHeatmap(all);$('recordWrap').innerHTML=rs.length?`<table class="table"><thead><tr><th>知识记录</th><th>状态</th><th>负责人</th><th>更新时间</th></tr></thead><tbody>${rs.map(r=>`<tr><td><a href="#" class="record-id" data-id="${esc(r.id)}">${esc(r.id)}</a><span class="record-title">${esc(r.title)}</span><span class="meta">${esc(r.type)} · ${esc(r.area)} ${r.tags?.length?'· '+esc(r.tags.join(' · ')):''}</span></td><td><span class="badge ${esc(r.status)}">${esc(r.status)}</span></td><td class="meta">${esc(r.owners.join(', ')||'—')}</td><td class="meta">${esc(r.updated||'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">没有符合当前筛选条件的记录。</div>';document.querySelectorAll('[data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();openRecord(a.dataset.id)});}
function renderBars(obj,el){const max=Math.max(1,...Object.values(obj));el.innerHTML=Object.entries(obj).map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar"><b style="width:${v/max*100}%"></b></div><span>${v}</span></div>`).join('')||'<div class="meta">暂无数据</div>'}
function renderHeatmap(records){const by={};records.forEach(r=>{if(r.updated)by[r.updated]=(by[r.updated]||0)+1});let html='';for(let i=0;i<288;i++){const d=new Date(Date.now()-((287-i)*86400000));const k=d.toISOString().slice(0,10),v=by[k]||0;html+=`<i class="cell ${v>=4?'l4':v===3?'l3':v===2?'l2':v===1?'l1':''}" title="${k}: ${v} 条记录"></i>`}$('heatmap').innerHTML=html}
function openRecord(id){const r=state.data.records.find(x=>x.id===id);if(!r)return;$('modalTitle').textContent=r.title;$('modalId').textContent=r.id;$('modalMeta').innerHTML=[['类型',r.type],['状态',r.status],['负责人',r.owners.join(', ')],['领域',r.area||'—'],['模型',r.model_family||'—'],['加速器',r.accelerator||'—'],['更新时间',r.updated||'—'],['标签',r.tags.join(', ')||'—']].map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('');const links=state.data.edges.filter(e=>e.source===id||e.target===id).map(e=>{const other=e.source===id?e.target:e.source;return `<div class="relation">${esc(e.relation||'关联')} · <a href="#" data-id="${esc(other)}">${esc(other)}</a></div>`}).join('');$('modalRelations').innerHTML=links||'<div class="meta">暂无引用关系。</div>';$('modalPath').textContent=r.path||'导入的知识记录';$('modal').classList.add('open');document.querySelectorAll('#modal [data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();openRecord(a.dataset.id)});}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;state.status='all';document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{state.status=b.dataset.status;state.type='all';document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x.dataset.type==='all'));render()});$('globalSearch').oninput=e=>{state.query=e.target.value;$('tableSearch').value=e.target.value;render()};$('tableSearch').oninput=e=>{state.query=e.target.value;$('globalSearch').value=e.target.value;render()};$('sortSelect').onchange=e=>{state.sort=e.target.value;render()};$('clearBtn').onclick=()=>{state={...state,type:'all',status:'all',query:'',sort:'updated'};$('globalSearch').value='';$('tableSearch').value='';document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x.dataset.type==='all'));render()};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{load(JSON.parse(reader.result))}catch{toast('catalog.json 格式无效')}};reader.readAsText(f)};$('contributeBtn').onclick=()=>toast('请新建分支、起草记录、完成校验，再发布 PR。');$('syncBtn').onclick=()=>toast('请在知识仓运行 team-wiki sync。');$('buildBtn').onclick=()=>toast('请运行 team-wiki build 刷新 catalog.json。');$('closeModal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open');};render();renderTree();renderGraph();
// 打开方式决定数据来源：HTTP(S) 下自动读取同目录 catalog.json；file:// 下由浏览器安全策略禁止 fetch，
// 提示用“导入 catalog.json”按钮手动选择知识仓的 generated/catalog.json。
(function boot(){if(!/^https?:$/.test(location.protocol)){toast('本地打开：请点“导入 catalog.json”选择知识仓 generated/catalog.json');return;}fetch('./catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json()}).then(data=>load(data)).catch(()=>toast('同目录未找到 catalog.json，请手动导入'));})();
</script>
</body>
</html>
